<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RP Banking Admin • Firebase</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;background:#f5f7fb;color:#172033}.glass{backdrop-filter:blur(14px);background:rgba(255,255,255,.9)}.sidebar{background:linear-gradient(180deg,#08111f,#0f1d31)}.nav-active{background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 10px 25px #2563eb33}.card{border:1px solid #e7ebf2;box-shadow:0 8px 30px #1720330a}.bank-card{width:min(430px,100%);aspect-ratio:1.586/1;border-radius:24px;position:relative;overflow:hidden;color:#fff;padding:26px;background:linear-gradient(135deg,#164e9c,#2563eb 55%,#60a5fa)}.bank-card.black{background:linear-gradient(135deg,#111827,#020617)}.bank-card.gold{background:linear-gradient(135deg,#b7791f,#f59e0b,#fde68a);color:#21170a}.bank-card:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-120px;background:#ffffff18}.chip{width:54px;height:40px;border-radius:9px;background:linear-gradient(135deg,#fde68a,#b45309);border:1px solid #fff6}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.toast{animation:toast .2s ease-out}@keyframes toast{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}.modal-bg{background:#02061788;backdrop-filter:blur(5px)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,set,get,update,push,remove,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import {getStorage,ref as sRef,uploadString,getDownloadURL} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';

const firebaseConfig={apiKey:'AIzaSyD8cZVvAvmUmpXIsWvcx6bwfZy_L7p4f3M',authDomain:'registered-4b7de.firebaseapp.com',databaseURL:'https://registered-4b7de-default-rtdb.firebaseio.com',projectId:'registered-4b7de',storageBucket:'registered-4b7de.firebasestorage.app',messagingSenderId:'342078506670',appId:'1:342078506670:web:bd12e8b10475677668cf3f',measurementId:'G-1YLDWV8L6S'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getDatabase(fb),storage=getStorage(fb);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={user:null,profile:null,view:'dashboard',data:{cards:{},customers:{},transactions:{},admins:{},treasury:{balance:100000}},selected:null,scanner:null,toast:null,search:'',busy:false,issue:{name:'',age:'',school:'',photo:'',design:'blue',number:'',pin:'',cvv:''}};
let unsub=[];
function esc(v=''){return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function money(n){return new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)}
function date(v){if(!v)return '-';return new Date(v).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}
function id(p){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
function cardNum(){let s='5';for(let i=0;i<15;i++)s+=Math.floor(Math.random()*10);return s}
function gen(){state.issue.number=cardNum();state.issue.pin=String(Math.floor(1000+Math.random()*9000));state.issue.cvv=String(Math.floor(100+Math.random()*900));render()}
function notify(msg,type='ok'){state.toast={msg,type};render();setTimeout(()=>{state.toast=null;render()},2600)}
function dataArray(x){return Object.entries(x||{}).map(([key,v])=>({...v,key}))}
async function loadAll(){const snap=await get(ref(db,'/'));const d=snap.val()||{};state.data={cards:d.cards||{},customers:d.customers||{},transactions:d.transactions||{},admins:d.admins||{},treasury:d.treasury||{balance:100000}};render()}
function adminAllowed(){return state.user&&state.profile&&(state.profile.role==='admin'||state.profile.role==='Administrator')}
async function ensureProfile(user){let s=await get(ref(db,'admins/'+user.uid));if(!s.exists()){await set(ref(db,'admins/'+user.uid),{email:user.email,displayName:user.email.split('@')[0],role:'admin',createdAt:Date.now()});s=await get(ref(db,'admins/'+user.uid))}state.profile=s.val()}
async function login(email,password){state.busy=true;render();try{await signInWithEmailAndPassword(auth,email,password);notify('เข้าสู่ระบบสำเร็จ')}catch(e){notify(authMsg(e.code),'err')}finally{state.busy=false;render()}}
function authMsg(c){return ({'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีนี้','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง','auth/too-many-requests':'ลองใหม่ภายหลัง ระบบจำกัดการเข้าสู่ระบบชั่วคราว'})[c]||'เกิดข้อผิดพลาด: '+c}
async function logout(){await signOut(auth)}
function layout(){return `<div class="min-h-screen flex">${sidebar()}<main class="flex-1 min-w-0">${header()}<div class="p-4 md:p-7 max-w-[1500px] mx-auto">${content()}</div></main>${state.toast?`<div class="fixed bottom-5 right-5 z-[100] toast px-5 py-3 rounded-2xl shadow-2xl text-white ${state.toast.type==='err'?'bg-red-600':'bg-slate-900'}"><i class="fa-solid ${state.toast.type==='err'?'fa-circle-xmark':'fa-circle-check'} mr-2"></i>${esc(state.toast.msg)}</div>`:''}</div>`}
function sidebar(){let items=[['dashboard','fa-chart-pie','Dashboard'],['issue','fa-id-card','ออกบัตรใหม่'],['cards','fa-credit-card','จัดการบัตร'],['scan','fa-qrcode','สแกน / ตรวจสอบ'],['transactions','fa-clock-rotate-left','ธุรกรรม'],['treasury','fa-vault','คลังเงิน']];return `<aside class="sidebar text-white w-64 shrink-0 hidden md:flex flex-col min-h-screen sticky top-0 h-screen"><div class="p-6 border-b border-white/10"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-blue-500 flex items-center justify-center shadow-lg"><i class="fa-solid fa-building-columns text-xl"></i></div><div><b>RP BANKING</b><div class="text-xs text-blue-300">Firebase Edition</div></div></div></div><nav class="p-3 space-y-1 flex-1">${items.map(x=>`<button onclick="window.go('${x[0]}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left ${state.view===x[0]?'nav-active text-white':'text-slate-400 hover:bg-white/5 hover:text-white'}"><i class="fa-solid ${x[1]} w-5"></i>${x[2]}</button>`).join('')}</nav><div class="p-4 border-t border-white/10"><div class="text-sm truncate">${esc(state.profile?.displayName||state.user?.email||'Admin')}</div><div class="text-xs text-slate-400 truncate">${esc(state.user?.email||'')}</div><button onclick="window.logout()" class="mt-3 w-full py-2 rounded-xl bg-white/5 hover:bg-red-500/20 text-slate-300"><i class="fa-solid fa-right-from-bracket mr-2"></i>ออกจากระบบ</button></div></aside>`}
function header(){return `<header class="h-16 bg-white border-b border-slate-200 sticky top-0 z-20 flex items-center justify-between px-4 md:px-7"><div><div class="font-bold text-lg">${esc(({dashboard:'Dashboard',issue:'ออกบัตรใหม่',cards:'จัดการบัตร',scan:'สแกน / ตรวจสอบ',transactions:'ธุรกรรม',treasury:'คลังเงิน'})[state.view])}</div><div class="text-xs text-slate-400">${new Date().toLocaleString('th-TH')}</div></div><button class="md:hidden p-2" onclick="window.mobileMenu()"><i class="fa-solid fa-bars"></i></button></header>`}
function content(){if(state.view==='dashboard')return dashboard();if(state.view==='issue')return issue();if(state.view==='cards')return cards();if(state.view==='scan')return scan();if(state.view==='transactions')return transactions();if(state.view==='treasury')return treasury();return ''}
function stat(title,value,icon,cls){return `<div class="card bg-white rounded-3xl p-5"><div class="flex items-center justify-between"><div><div class="text-sm text-slate-500">${title}</div><div class="text-2xl font-extrabold mt-2">${value}</div></div><div class="w-12 h-12 rounded-2xl ${cls} flex items-center justify-center"><i class="fa-solid ${icon}"></i></div></div></div>`}
function dashboard(){let cs=dataArray(state.data.cards),cu=dataArray(state.data.customers),tx=dataArray(state.data.transactions),active=cs.filter(c=>c.status==='Active').length,today=new Date().toDateString();return `<section class="space-y-6"><div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${stat('เงินในคลัง','฿'+money(state.data.treasury.balance),'fa-vault','bg-blue-50 text-blue-600')}${stat('ลูกค้าทั้งหมด',cu.length,'fa-users','bg-violet-50 text-violet-600')}${stat('บัตร Active',active,'fa-credit-card','bg-emerald-50 text-emerald-600')}${stat('ธุรกรรมวันนี้',tx.filter(t=>new Date(t.createdAt||0).toDateString()===today).length,'fa-money-bill-transfer','bg-orange-50 text-orange-600')}</div><div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 card bg-white rounded-3xl overflow-hidden"><div class="p-5 border-b flex justify-between"><b>ธุรกรรมล่าสุด</b><button onclick="window.go('transactions')" class="text-blue-600 text-sm">ดูทั้งหมด</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4 text-left">ประเภท</th><th class="p-4 text-left">บัตร</th><th class="p-4 text-right">จำนวน</th><th class="p-4 text-left">เวลา</th></tr></thead><tbody>${tx.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,8).map(t=>`<tr class="border-t"><td class="p-4"><span class="px-2 py-1 rounded-lg text-xs ${t.type==='Deposit'?'bg-emerald-50 text-emerald-700':'bg-orange-50 text-orange-700'}">${t.type}</span></td><td class="p-4 mono">${esc(t.cardNumber||t.cardId)}</td><td class="p-4 text-right font-bold ${t.amount>0?'text-emerald-600':'text-red-600'}">${t.amount>0?'+':''}${money(t.amount)}</td><td class="p-4 text-slate-400">${date(t.createdAt)}</td></tr>`).join('')||`<tr><td colspan="4" class="p-10 text-center text-slate-400">ยังไม่มีธุรกรรม</td></tr>`}</tbody></table></div></div><div class="card bg-white rounded-3xl p-5"><b>เมนูด่วน</b><div class="grid gap-3 mt-4"><button onclick="window.go('issue')" class="p-4 rounded-2xl bg-blue-50 text-blue-700 text-left"><i class="fa-solid fa-id-card mr-2"></i>ออกบัตรใหม่</button><button onclick="window.go('scan')" class="p-4 rounded-2xl bg-violet-50 text-violet-700 text-left"><i class="fa-solid fa-qrcode mr-2"></i>เปิดเครื่องสแกน</button><button onclick="window.go('treasury')" class="p-4 rounded-2xl bg-emerald-50 text-emerald-700 text-left"><i class="fa-solid fa-vault mr-2"></i>จัดการคลังเงิน</button></div></div></div></section>`}
function issue(){let x=state.issue;return `<section class="max-w-6xl mx-auto"><div class="card bg-white rounded-3xl p-5 md:p-7"><div class="flex items-center justify-between mb-6"><div><h2 class="text-xl font-bold">ออกบัตรใหม่</h2><p class="text-sm text-slate-400">สร้างลูกค้า + บัตร + QR + Barcode ในครั้งเดียว</p></div><span class="px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-xs">Firebase Realtime Database</span></div><div class="grid lg:grid-cols-2 gap-7"><div class="space-y-4"><div><label class="label">ชื่อ-นามสกุล *</label><input id="i-name" value="${esc(x.name)}" class="input" placeholder="ชื่อผู้ถือบัตร"></div><div class="grid grid-cols-2 gap-4"><div><label class="label">อายุ</label><input id="i-age" type="number" value="${esc(x.age)}" class="input"></div><div><label class="label">โรงเรียน / กลุ่ม</label><input id="i-school" value="${esc(x.school)}" class="input"></div></div><div><label class="label">รูปโปรไฟล์</label><input id="i-photo" type="file" accept="image/*" class="input" onchange="window.photo(this)"></div><div><label class="label">ดีไซน์</label><div class="flex gap-3">${['blue','black','gold'].map(d=>`<button onclick="window.design('${d}')" class="w-12 h-12 rounded-full ${d==='blue'?'bg-blue-600':d==='black'?'bg-black':'bg-amber-400'} ${x.design===d?'ring-4 ring-blue-300':''}"></button>`).join('')}</div></div><div class="p-4 rounded-2xl bg-slate-50 border"><div class="flex justify-between items-center"><b>ข้อมูลบัตร</b><button onclick="window.gen()" class="text-blue-600 text-sm">สุ่มใหม่</button></div><div class="mono text-lg font-bold tracking-wider mt-3">${x.number?x.number.replace(/(.{4})/g,'$1 ').trim():'XXXX XXXX XXXX XXXX'}</div><div class="grid grid-cols-2 gap-4 mt-3"><div><small class="text-slate-400">PIN</small><div class="mono font-bold">${x.pin||'----'}</div></div><div><small class="text-slate-400">CVV</small><div class="mono font-bold">${x.cvv||'---'}</div></div></div></div><button onclick="window.issueCard()" class="w-full py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold"><i class="fa-solid fa-plus mr-2"></i>ออกบัตรและเปิดบัญชี</button></div><div class="bg-slate-100 rounded-3xl p-5 flex flex-col items-center justify-center"><div id="card-preview" class="bank-card ${x.design}"><div class="relative z-10 h-full flex flex-col justify-between"><div class="flex justify-between"><b class="tracking-widest">RP BANK</b><i class="fa-solid fa-wifi rotate-90"></i></div><div class="chip"></div><div><div class="mono text-xl tracking-widest">${x.number?x.number.replace(/(.{4})/g,'$1 ').trim():'•••• •••• •••• ••••'}</div><div class="flex justify-between items-end mt-3"><div><small class="opacity-60">CARDHOLDER</small><div class="font-bold uppercase truncate max-w-[220px]">${esc(x.name)||'YOUR NAME'}</div></div><canvas id="miniQR" width="70" height="70" class="bg-white p-1 rounded-lg"></canvas></div></div></div></div><div class="mt-5 w-full bg-white rounded-2xl p-4"><div class="text-xs text-slate-400 mb-2">BARCODE</div><svg id="previewBarcode" class="w-full"></svg></div><div class="text-xs text-slate-400 mt-3">บัตรจะมี QR สำหรับเปิดข้อมูลบัตร และ Barcode สำหรับสแกน</div></div></div></div></section>`}
function cards(){let cs=dataArray(state.data.cards),q=state.search.toLowerCase();if(q)cs=cs.filter(c=>(c.cardNumber||'').includes(q)||(c.id||'').toLowerCase().includes(q)||(state.data.customers[c.customerId]?.name||'').toLowerCase().includes(q));return `<section class="space-y-5"><div class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between"><div><h2 class="text-xl font-bold">จัดการบัตร</h2><p class="text-sm text-slate-400">ค้นหา ตรวจสอบยอดเงิน ล็อกบัตร และดูธุรกรรม</p></div><div class="flex gap-2"><input value="${esc(state.search)}" oninput="window.cardSearch(this.value)" class="input w-full md:w-80" placeholder="ค้นหา Card ID / เลขบัตร / ชื่อ"><button onclick="window.go('issue')" class="px-4 rounded-xl bg-blue-600 text-white"><i class="fa-solid fa-plus"></i></button></div></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${cs.map(c=>{let u=state.data.customers[c.customerId]||{},b=c.balance||0;return `<div class="card bg-white rounded-3xl p-4"><div class="bank-card ${c.design||'blue'} mx-auto" style="transform:scale(.78);transform-origin:top center;margin-bottom:-50px"><div class="relative z-10 h-full flex flex-col justify-between"><div class="flex justify-between"><b>RP BANK</b><i class="fa-solid fa-wifi rotate-90"></i></div><div class="chip"></div><div><div class="mono">${(c.cardNumber||'').replace(/(.{4})/g,'$1 ')}</div><div class="text-xs mt-2">${esc(u.name)}</div></div></div></div><div class="pt-3"><div class="flex justify-between"><b>${esc(u.name||'-')}</b><span class="text-xs px-2 py-1 rounded-lg ${c.status==='Active'?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'}">${c.status}</span></div><div class="text-xs text-slate-400 mono mt-1">${esc(c.id)}</div><div class="flex justify-between items-end mt-4"><div><small class="text-slate-400">ยอดเงิน</small><div class="text-xl font-extrabold">฿${money(b)}</div></div><button onclick="window.manage('${c.id}')" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm">จัดการ</button></div></div></div>`}).join('')||`<div class="md:col-span-3 p-12 text-center text-slate-400">ไม่พบบัตร</div>`}</div></section>`}
function scan(){return `<section class="max-w-5xl mx-auto space-y-5"><div><h2 class="text-xl font-bold">สแกน / ตรวจสอบบัตร</h2><p class="text-sm text-slate-400">ใช้กล้องสแกน QR หรือ Barcode หรือกรอก Card ID / เลขบัตร</p></div><div class="grid lg:grid-cols-2 gap-5"><div class="card bg-white rounded-3xl p-5"><div id="reader" class="rounded-2xl overflow-hidden bg-slate-950 min-h-64"></div><div class="grid grid-cols-2 gap-3 mt-4"><button onclick="window.startScan()" class="py-3 rounded-xl bg-blue-600 text-white font-bold">เปิดกล้อง</button><button onclick="window.stopScan()" class="py-3 rounded-xl bg-slate-100">หยุด</button></div><div class="mt-4"><input id="scan-input" class="input" placeholder="CARD-... หรือ 16 หลัก"><button onclick="window.lookup($('#scan-input').value)" class="w-full mt-2 py-3 rounded-xl bg-slate-900 text-white">ตรวจสอบ</button></div></div><div id="scan-result" class="card bg-white rounded-3xl p-5">${state.selected?detail(state.selected,true):`<div class="h-full min-h-64 flex items-center justify-center text-slate-400 text-center"><div><i class="fa-solid fa-qrcode text-5xl mb-4"></i><div>ผลการสแกนจะแสดงที่นี่</div></div></div>`}</div></div></section>`}
function detail(c,fromScan=false){let u=state.data.customers[c.customerId]||{};return `<div class="space-y-4"><div class="flex justify-between items-start"><div><b class="text-xl">${esc(u.name||'-')}</b><div class="text-xs text-slate-400 mono">${esc(c.id)}</div></div><span class="px-2 py-1 rounded-lg text-xs ${c.status==='Active'?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'}">${c.status}</span></div>${u.photoUrl?`<img src="${esc(u.photoUrl)}" class="w-24 h-24 rounded-2xl object-cover">`:''}<div class="p-4 rounded-2xl bg-slate-50"><div class="text-xs text-slate-400">เลขบัตร</div><div class="mono font-bold">${(c.cardNumber||'').replace(/(.{4})/g,'$1 ')}</div><div class="text-xs text-slate-400 mt-3">ยอดเงิน</div><div class="text-3xl font-extrabold">฿${money(c.balance)}</div></div><div class="grid grid-cols-2 gap-3"><button onclick="window.manage('${c.id}')" class="py-3 rounded-xl bg-blue-600 text-white">จัดการบัตร</button><button onclick="window.cardImage('${c.id}')" class="py-3 rounded-xl bg-violet-600 text-white">ดาวน์โหลดภาพ</button></div><button onclick="window.printCard('${c.id}')" class="w-full py-3 rounded-xl bg-slate-100"><i class="fa-solid fa-print mr-2"></i>พิมพ์บัตร</button></div>`}
function transactions(){let tx=dataArray(state.data.transactions).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return `<section class="space-y-5"><h2 class="text-xl font-bold">ประวัติธุรกรรม</h2><div class="card bg-white rounded-3xl overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4 text-left">เวลา</th><th class="p-4 text-left">บัตร</th><th class="p-4 text-left">ประเภท</th><th class="p-4 text-right">จำนวน</th><th class="p-4 text-left">หมายเหตุ</th><th class="p-4 text-left">Admin</th></tr></thead><tbody>${tx.map(t=>`<tr class="border-t"><td class="p-4">${date(t.createdAt)}</td><td class="p-4 mono">${esc(t.cardNumber||t.cardId)}</td><td class="p-4">${t.type}</td><td class="p-4 text-right font-bold ${t.amount>0?'text-emerald-600':'text-red-600'}">${t.amount>0?'+':''}${money(t.amount)}</td><td class="p-4">${esc(t.note||'-')}</td><td class="p-4 text-slate-400">${esc(t.admin||'-')}</td></tr>`).join('')||`<tr><td colspan="6" class="p-10 text-center text-slate-400">ยังไม่มีรายการ</td></tr>`}</tbody></table></div></section>`}
function treasury(){return `<section class="max-w-4xl mx-auto space-y-5"><h2 class="text-xl font-bold">คลังเงินธนาคาร</h2><div class="rounded-3xl p-7 bg-gradient-to-br from-slate-900 to-blue-950 text-white"><div class="text-sm text-slate-400">ยอดเงินในคลัง</div><div class="text-4xl font-extrabold mt-2">฿${money(state.data.treasury.balance)}</div></div><div class="card bg-white rounded-3xl p-6"><div class="grid md:grid-cols-2 gap-4"><div><label class="label">จำนวนเงิน</label><input id="vault-amt" type="number" min="0" class="input" placeholder="0"></div><div><label class="label">หมายเหตุ</label><input id="vault-note" class="input" placeholder="เช่น เติมทุนธนาคาร"></div></div><div class="grid grid-cols-2 gap-3 mt-4"><button onclick="window.vault('add')" class="py-3 rounded-xl bg-emerald-600 text-white font-bold">เพิ่มเงิน</button><button onclick="window.vault('remove')" class="py-3 rounded-xl bg-red-600 text-white font-bold">ลดเงิน</button></div></div></section>`}
function manageModal(c){let u=state.data.customers[c.customerId]||{},tx=dataArray(state.data.transactions).filter(t=>t.cardId===c.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return `<div id="modal" class="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4"><div class="bg-white w-full max-w-4xl max-h-[92vh] overflow-y-auto rounded-3xl p-6"><div class="flex justify-between items-start"><div><h2 class="text-2xl font-bold">${esc(u.name||'-')}</h2><div class="text-sm text-slate-400 mono">${esc(c.cardNumber)}</div></div><button onclick="window.closeModal()" class="text-2xl">×</button></div><div class="grid lg:grid-cols-3 gap-4 mt-5"><div class="lg:col-span-2 p-5 rounded-2xl bg-slate-50"><div class="text-sm text-slate-400">ยอดเงินคงเหลือ</div><div class="text-4xl font-extrabold">฿${money(c.balance)}</div><div class="grid grid-cols-2 gap-3 mt-5"><input id="m-amt" type="number" min="0" class="input" placeholder="จำนวนเงิน"><input id="m-note" class="input" placeholder="หมายเหตุ"></div><div class="grid grid-cols-2 gap-3 mt-3"><button onclick="window.tx('${c.id}','Deposit')" class="py-3 rounded-xl bg-emerald-600 text-white font-bold">+ เติมเงิน</button><button onclick="window.tx('${c.id}','Withdraw')" class="py-3 rounded-xl bg-orange-500 text-white font-bold">− หักเงิน</button></div></div><div class="p-5 rounded-2xl border"><div class="text-sm text-slate-400">สถานะ</div><div class="font-bold mt-1">${c.status}</div><button onclick="window.toggle('${c.id}')" class="w-full mt-4 py-2 rounded-xl ${c.status==='Active'?'bg-red-50 text-red-600':'bg-emerald-50 text-emerald-600'}">${c.status==='Active'?'ล็อกบัตร':'ปลดล็อกบัตร'}</button><button onclick="window.resetPin('${c.id}')" class="w-full mt-2 py-2 rounded-xl bg-blue-50 text-blue-600">รีเซ็ต PIN</button><button onclick="window.cardImage('${c.id}')" class="w-full mt-2 py-2 rounded-xl bg-violet-50 text-violet-600">ดาวน์โหลดบัตร</button><button onclick="window.printCard('${c.id}')" class="w-full mt-2 py-2 rounded-xl bg-slate-100">พิมพ์บัตร</button></div></div><div class="mt-5"><b>ประวัติรายการ</b><div class="mt-3 border rounded-2xl overflow-x-auto"><table class="w-full text-sm"><tbody>${tx.slice(0,20).map(t=>`<tr class="border-t"><td class="p-3">${date(t.createdAt)}</td><td class="p-3">${t.type}</td><td class="p-3 text-right font-bold">${t.amount>0?'+':''}${money(t.amount)}</td><td class="p-3">${esc(t.note||'-')}</td></tr>`).join('')||`<tr><td class="p-5 text-center text-slate-400">ไม่มีรายการ</td></tr>`}</tbody></table></div></div></div></div>`}
function login(){return `<div class="min-h-screen grid lg:grid-cols-2 bg-slate-950"><div class="hidden lg:flex items-center justify-center p-12 bg-gradient-to-br from-blue-700 to-indigo-950 text-white"><div class="max-w-lg"><div class="w-16 h-16 rounded-2xl bg-white/15 flex items-center justify-center text-3xl mb-6"><i class="fa-solid fa-building-columns"></i></div><h1 class="text-5xl font-extrabold">RP Banking</h1><p class="mt-4 text-blue-100 text-lg">ระบบจัดการบัตรธนาคาร Roleplay เชื่อม Firebase และใช้งานบน GitHub Pages ได้</p><div class="grid grid-cols-2 gap-3 mt-8 text-sm"><div class="p-4 rounded-2xl bg-white/10">QR + Barcode</div><div class="p-4 rounded-2xl bg-white/10">ฝาก / ถอน</div><div class="p-4 rounded-2xl bg-white/10">ดาวน์โหลด PNG</div><div class="p-4 rounded-2xl bg-white/10">พิมพ์บัตร</div></div></div></div><div class="flex items-center justify-center p-6"><form onsubmit="window.login(event)" class="w-full max-w-md glass rounded-3xl p-7 shadow-2xl"><div class="lg:hidden text-center mb-6"><div class="w-14 h-14 mx-auto rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl"><i class="fa-solid fa-building-columns"></i></div></div><h2 class="text-2xl font-bold text-white lg:text-slate-900">เข้าสู่ระบบผู้ดูแล</h2><p class="text-slate-400 text-sm mt-1">Firebase Authentication</p><label class="label mt-6">อีเมล</label><input id="email" type="email" class="input" required placeholder="admin@example.com"><label class="label mt-4">รหัสผ่าน</label><input id="password" type="password" class="input" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร"><button class="w-full mt-6 py-3 rounded-2xl bg-blue-600 text-white font-bold">เข้าสู่ระบบ</button><button type="button" onclick="window.register()" class="w-full mt-2 py-3 rounded-2xl bg-slate-100 text-slate-700">สร้างบัญชีผู้ดูแลครั้งแรก</button><p class="text-xs text-slate-400 mt-5">หมายเหตุ: ต้องเปิด Email/Password ใน Firebase Authentication ก่อน</p></form></div></div>`}
const style=()=>{let s=document.createElement('style');s.textContent='.label{display:block;font-size:.85rem;font-weight:600;color:#475569;margin-bottom:.4rem}.input{width:100%;border:1px solid #dbe2ea;border-radius:14px;padding:.75rem .9rem;outline:none;background:#fff}.input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #60a5fa22}';document.head.appendChild(s)};
function render(){style();document.getElementById('app').innerHTML=state.user&&adminAllowed()?layout():login();if(state.user&&state.view==='issue')setTimeout(drawCodes,50)}
async function drawCodes(){if(!state.issue.number)return;try{await QRCode.toCanvas($('#miniQR'),JSON.stringify({card:state.issue.number}),{width:70,margin:0});JsBarcode('#previewBarcode',state.issue.number,{format:'CODE128',height:55,displayValue:true,fontSize:12,margin:0})}catch(e){}}
window.go=v=>{state.view=v;state.selected=null;stopScan();render()};
window.login=e=>{e.preventDefault();login($('#email').value,$('#password').value)};
window.register=async()=>{let email=prompt('อีเมลผู้ดูแล');if(!email)return;let pw=prompt('รหัสผ่านอย่างน้อย 6 ตัวอักษร');if(!pw)return;try{let c=await createUserWithEmailAndPassword(auth,email,pw);await set(ref(db,'admins/'+c.user.uid),{email,displayName:email.split('@')[0],role:'admin',createdAt:Date.now()});notify('สร้างบัญชีสำเร็จ')}catch(e){notify(authMsg(e.code),'err')}};
window.logout=logout;window.design=d=>{state.issue.design=d;render()};window.gen=gen;
window.photo=el=>{let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.issue.photo=r.result;render()};r.readAsDataURL(f)};
window.issueCard=async()=>{let name=$('#i-name')?.value.trim();state.issue.name=name;state.issue.age=$('#i-age')?.value||'';state.issue.school=$('#i-school')?.value||'';if(!name){notify('กรุณากรอกชื่อ','err');return}if(!state.issue.number)gen();state.busy=true;render();try{let customerId=id('CUST'),cardId=id('CARD'),now=Date.now(),photoUrl='';if(state.issue.photo){let sr=sRef(storage,'customerPhotos/'+customerId+'.jpg');await uploadString(sr,state.issue.photo,'data_url');photoUrl=await getDownloadURL(sr)}await set(ref(db,'customers/'+customerId),{id:customerId,name,age:Number(state.issue.age)||null,school:state.issue.school,photoUrl,createdAt:now});await set(ref(db,'cards/'+cardId),{id:cardId,customerId,cardNumber:state.issue.number,pin:state.issue.pin,cvv:state.issue.cvv,design:state.issue.design,status:'Active',balance:0,createdAt:now});let issueTxId=id('TX');await set(ref(db,'transactions/'+issueTxId),{id:issueTxId,cardId,cardNumber:state.issue.number,type:'Issue',amount:0,note:'ออกบัตรใหม่',admin:state.user.email,createdAt:now});await loadAll();notify('ออกบัตรสำเร็จ');state.selected=state.data.cards[cardId];state.issue={name:'',age:'',school:'',photo:'',design:'blue',number:'',pin:'',cvv:''};render();setTimeout(()=>window.manage(cardId),250)}catch(e){notify(e.message,'err')}finally{state.busy=false}};
window.cardSearch=v=>{state.search=v;render()};window.manage=id=>{let c=state.data.cards[id];if(!c)return;document.body.insertAdjacentHTML('beforeend',manageModal(c))};window.closeModal=()=>$('#modal')?.remove();
window.tx=async(cardId,type)=>{let amount=Number($('#m-amt').value),note=$('#m-note').value;if(!amount||amount<=0){notify('กรุณาระบุจำนวนเงิน','err');return}let cardRef=ref(db,'cards/'+cardId),vaultRef=ref(db,'treasury/balance');try{let result=await runTransaction(cardRef,c=>{if(!c)return c;if(c.status!=='Active')return;let next=(Number(c.balance)||0)+(type==='Deposit'?amount:-amount);if(next<0)return; c.balance=next; c.updatedAt=Date.now();return c});if(!result.committed){notify('ทำรายการไม่ได้: บัตรอาจถูกล็อกหรือยอดไม่พอ','err');return}let delta=type==='Deposit'?amount:-amount;let vr=await runTransaction(vaultRef,v=>(Number(v)||0)+delta);if(!vr.committed){notify('คลังเงินไม่สามารถปรับยอดได้','err');return}let txId=id('TX');await set(ref(db,'transactions/'+txId),{id:txId,cardId,cardNumber:state.data.cards[cardId].cardNumber,type,amount:delta,note,admin:state.user.email,createdAt:Date.now()});await loadAll();closeModal();notify(type==='Deposit'?'เติมเงินสำเร็จ':'หักเงินสำเร็จ');}catch(e){notify(e.message,'err')}};
window.toggle=async id=>{let c=state.data.cards[id];if(!c)return;await update(ref(db,'cards/'+id),{status:c.status==='Active'?'Locked':'Active',updatedAt:Date.now()});await loadAll();closeModal();notify('เปลี่ยนสถานะบัตรแล้ว')};
window.resetPin=async id=>{let pin=String(Math.floor(1000+Math.random()*9000));await update(ref(db,'cards/'+id),{pin,updatedAt:Date.now()});await loadAll();closeModal();notify('PIN ใหม่: '+pin)};
window.lookup=q=>{q=(q||'').trim();let c=dataArray(state.data.cards).find(x=>x.id===q||x.cardNumber===q);if(!c){notify('ไม่พบบัตร','err');return}state.selected=c;render()};
window.startScan=async()=>{stopScan();state.scanner=new Html5Qrcode('reader');try{await state.scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:180}},text=>{let q=text;try{let o=JSON.parse(text);q=o.card||o.cardId||text}catch{}window.lookup(q);stopScan()})}catch(e){notify('เปิดกล้องไม่ได้: '+e.message,'err')}};window.stopScan=async()=>{if(state.scanner){try{await state.scanner.stop()}catch{}state.scanner=null}};
window.vault=async mode=>{let amount=Number($('#vault-amt').value);if(!amount||amount<=0){notify('จำนวนเงินไม่ถูกต้อง','err');return}let r=await runTransaction(ref(db,'treasury/balance'),v=>{v=Number(v)||0;let n=mode==='add'?v+amount:v-amount;return n<0?undefined:n});if(!r.committed){notify('ยอดคลังไม่เพียงพอ','err');return}await loadAll();notify(mode==='add'?'เพิ่มเงินเข้าคลังแล้ว':'ลดเงินจากคลังแล้ว')};
async function cardNode(c){let u=state.data.customers[c.customerId]||{};let wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-10000px;top:0;width:900px;padding:60px;background:white';wrap.innerHTML=`<div id="exportCard" class="bank-card ${c.design||'blue'}" style="width:700px"><div class="relative z-10 h-full flex flex-col justify-between"><div class="flex justify-between"><b>RP BANK</b><i class="fa-solid fa-wifi rotate-90"></i></div><div class="chip"></div><div><div class="mono text-2xl tracking-widest">${esc((c.cardNumber||'').replace(/(.{4})/g,'$1 '))}</div><div class="flex justify-between"><div><small>CARDHOLDER</small><div class="font-bold">${esc(u.name||'')}</div></div><div><small>VALID</small><div>RP BANK</div></div></div></div></div></div><div style="margin-top:20px;text-align:center"><svg id="bar" style="width:700px"></svg></div>`;document.body.appendChild(wrap);JsBarcode(wrap.querySelector('#bar'),c.cardNumber,{format:'CODE128',height:80,displayValue:true});return wrap}
window.cardImage=async id=>{let c=state.data.cards[id];if(!c)return;let w=await cardNode(c);try{let canvas=await html2canvas(w,{scale:2,backgroundColor:'#fff'});let a=document.createElement('a');a.download='RP_CARD_'+c.cardNumber+'.png';a.href=canvas.toDataURL('image/png');a.click();notify('ดาวน์โหลดบัตรแล้ว')}finally{w.remove()}};
window.printCard=async id=>{let c=state.data.cards[id],u=state.data.customers[c.customerId]||{};let w=await cardNode(c);let img=(await html2canvas(w,{scale:2,backgroundColor:'#fff'})).toDataURL('image/png');w.remove();let p=window.open('','_blank');p.document.write(`<html><head><title>RP Card</title><style>body{text-align:center;margin:0;padding:20px;font-family:Arial}img{max-width:100%}</style></head><body><h2>RP BANK — ${esc(u.name||'')}</h2><img src="${img}"><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);p.document.close()};
window.mobileMenu=()=>alert('เปิดใช้งานบนมือถือได้ แต่เมนูจะใช้ปุ่มในเวอร์ชัน responsive นี้');
onAuthStateChanged(auth,async user=>{state.user=user;if(user){await ensureProfile(user);await loadAll()}else{state.profile=null;render()}});render();
</script>
</body></html>
